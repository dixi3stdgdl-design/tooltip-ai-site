<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — ToolTip AI</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<style>
  /* Autocontenida: el 404 no depende de la hoja de estilos de la portada. */
  :root{
    --fondo:#04060A; --agua:#7BE4E4; --menta:#B1F4D8; --tinta:#EAF6F8; --bruma:#8AA0A8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--fondo); color:var(--tinta);
    font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
    display:grid; place-items:center; padding:32px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  .caja{max-width:44rem;width:100%;text-align:center}
  .haz{
    display:block;width:100%;height:1px;margin-bottom:2.5rem;
    background:linear-gradient(90deg,transparent,var(--agua),var(--menta),transparent);
    box-shadow:0 0 18px 1px rgba(123,228,228,.45);
  }
  .codigo{
    font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;color:var(--bruma);
    margin:0 0 .75rem;
  }
  h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:600;margin:0 0 1rem;letter-spacing:-.015em}
  p{margin:0 auto 2rem;max-width:34rem;color:#C2D6DC}
  .acciones{display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap}
  a{color:var(--agua);text-decoration:none;border-bottom:1px solid rgba(123,228,228,.28);padding-bottom:2px}
  a:hover{color:var(--menta);border-bottom-color:var(--menta)}
  a:focus-visible{outline:2px solid var(--menta);outline-offset:4px;border-radius:2px}
  .secundaria{color:var(--bruma);border-bottom-color:rgba(138,160,168,.25)}
  .secundaria:hover{color:var(--tinta);border-bottom-color:var(--tinta)}
</style>
</head>
<body>
<main class="caja">
  <span class="haz" aria-hidden="true"></span>
  <p class="codigo">404 · sin lectura bajo el cursor</p>
  <h1>Esta página ya no está</h1>
  <p>ToolTip AI es una sola aplicación para Windows 11 y este sitio es una sola página.
     Lo que buscabas pertenecía a la estructura anterior, cuando el producto estaba partido en varias apps.</p>
  <nav class="acciones">
    <a href="/">Volver a ToolTip AI</a>
    <a class="secundaria" href="/privacy/">Política de privacidad</a>
  </nav>
</main>
</body>
</html>
